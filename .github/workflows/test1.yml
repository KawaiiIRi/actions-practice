name: Share job data
on: push
jobs:
  Mae:
    runs-on: ubuntu-latest
    steps:
      - id: generate
        run: echo "result=Hello" >> ${GITHUB_OUTPUT}
    outputs:
      result: ${{ steps.generate.outputs.result }}
  Ato:
    runs-on: ubuntu-latest
    needs: [Mae]
    steps:
      - env:
          RESULT: ${{ needs.Mae.outputs.result }}
        run: echo "${RESULT}"