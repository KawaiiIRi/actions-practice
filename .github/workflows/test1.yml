#uploadジョブ
#date.txtを作成
#  ↓
#path: date.txt
#アップロード元として指定
#  ↓
#GitHubへArtifact名「uploaded」で保存
#  ↓
#downloadジョブ（別のUbuntu環境）
#  ↓
#Artifact名「uploaded」を取得
#  ↓
#path: downloaded
#ダウンロード先として指定
#  ↓
#downloaded/date.txtを読み取る
name: Artifacts
on: push
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - run: date > date.txt
      - uses: actions/upload-artifact@v4
        with:
          name: uploaded
          path: date.txt
          retension-days: 7
  download:
    runs-on: ubuntu-latest
    needs: [upload]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: uploaded
          path: downloaded
      - run: cat downloaded/date.txt